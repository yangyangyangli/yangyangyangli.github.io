<line x1="489" y1="240" x2="510" y2="240" stroke="#c000b4" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="70" width="205" height="340" rx="15" fill="#f7f7f8" stroke="#d9dce1" stroke-width="1.5"/>
