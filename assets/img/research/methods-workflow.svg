<text class="base body" x="533" y="245" text-anchor="start"><tspan x="533" dy="0">UBEM · LCA</tspan><tspan x="533" dy="20">physics-based simulation</tspan><tspan x="533" dy="20">spatial analysis · GeoAI</tspan></text>
