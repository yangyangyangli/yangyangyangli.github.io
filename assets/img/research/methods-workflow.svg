<text class="base body" x="1003" y="245" text-anchor="start"><tspan x="1003" dy="0">spatial scenarios</tspan><tspan x="1003" dy="20">energy/carbon · risk maps</tspan><tspan x="1003" dy="20">municipal / planning evidence</tspan></text></svg>